<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_stack" name="shell-type"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-tint": "#565e74",
            "surface": "#f8f9ff",
            "on-surface": "#0b1c30",
            "on-tertiary": "#ffffff",
            "on-error-container": "#93000a",
            "tertiary-fixed-dim": "#68dba9",
            "inverse-on-surface": "#eaf1ff",
            "tertiary-container": "#002114",
            "surface-container": "#e5eeff",
            "on-tertiary-container": "#069669",
            "surface-bright": "#f8f9ff",
            "background": "#f8f9ff",
            "primary-fixed": "#dae2fd",
            "on-background": "#0b1c30",
            "on-tertiary-fixed": "#002114",
            "primary-container": "#131b2e",
            "on-secondary-fixed": "#410002",
            "secondary": "#bb0112",
            "tertiary": "#000000",
            "outline-variant": "#c6c6cd",
            "on-error": "#ffffff",
            "on-secondary-fixed-variant": "#93000b",
            "surface-container-highest": "#d3e4fe",
            "error-container": "#ffdad6",
            "on-primary-fixed-variant": "#3f465c",
            "primary": "#000000",
            "surface-variant": "#d3e4fe",
            "surface-container-low": "#eff4ff",
            "on-tertiary-fixed-variant": "#005137",
            "surface-container-high": "#dce9ff",
            "on-surface-variant": "#45464d",
            "secondary-container": "#e02928",
            "tertiary-fixed": "#85f8c4",
            "on-primary-container": "#7c839b",
            "on-primary-fixed": "#131b2e",
            "on-secondary-container": "#fffbff",
            "on-primary": "#ffffff",
            "outline": "#76777d",
            "inverse-surface": "#213145",
            "on-secondary": "#ffffff",
            "inverse-primary": "#bec6e0",
            "secondary-fixed-dim": "#ffb4ab",
            "secondary-fixed": "#ffdad6",
            "surface-dim": "#cbdbf5",
            "error": "#ba1a1a",
            "primary-fixed-dim": "#bec6e0",
            "surface-container-lowest": "#ffffff"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "3xl": "1.5rem",
            "full": "9999px"
          },
          spacing: {
            "space-sm": "0.5rem",
            "space-xs": "0.25rem",
            "margin": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2.5rem",
            "space-md": "1rem",
            "gutter": "1rem"
          },
          fontFamily: {
            "label-lg": ["JetBrains Mono"],
            "headline-xl-mobile": ["Space Grotesk"],
            "headline-lg-mobile": ["Space Grotesk"],
            "headline-xl": ["Space Grotesk"],
            "body-sm": ["Chivo"],
            "headline-md": ["Space Grotesk"],
            "body-md": ["Chivo"],
            "label-md": ["JetBrains Mono"],
            "headline-lg": ["Space Grotesk"],
            "body-lg": ["Chivo"],
            "label-sm": ["JetBrains Mono"]
          }
        }
      }
    };
  </script>
<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        min-height: 100%;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md antialiased selection:bg-surface-container-highest flex flex-col justify-between">
<!-- Header: Hamburger Left, Centered 'Session Active', Settings Right -->
<header class="fixed top-0 left-0 right-0 z-50 pt-safe bg-surface/90 backdrop-blur-md border-b border-surface-container-high/60">
<div class="h-14 px-4 flex items-center justify-between">
<!-- Hamburger Icon -->
<button aria-label="Open Navigation Menu" class="w-10 h-10 flex items-center justify-center rounded-xl text-on-surface hover:bg-surface-container active:scale-95 transition-all">
<span class="material-symbols-outlined text-[26px]">menu</span>
</button>
<!-- Centered Label "Session Active" with subtle live beacon dot -->
<div class="flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-secondary animate-pulse"></span>
<h1 class="font-headline-md text-[18px] font-bold text-on-surface tracking-tight">Session Active</h1>
</div>
<!-- Settings Icon -->
<button aria-label="Settings" class="w-10 h-10 flex items-center justify-center rounded-xl text-on-surface hover:bg-surface-container active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">settings</span>
</button>
</div>
</header>
<!-- Main Chat & Content Area -->
<main class="flex-1 flex flex-col justify-end w-full max-w-lg mx-auto pt-20 pb-36 px-4">
<!-- Clean Minimal Recipient Status Pill -->
<div class="flex justify-center mb-6">
<div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-[11px] tracking-wide">
<span class="w-2 h-2 rounded-full bg-on-tertiary-container"></span>
<span>Marcus Vance · Mesh Connected</span>
</div>
</div>
<!-- WhatsApp-Inspired Chat Thread -->
<div class="flex flex-col space-y-4 mb-6">
<!-- Incoming Message (Marcus Vance) -->
<div class="flex flex-col items-start max-w-[84%] self-start">
<div class="bg-surface-container-lowest text-on-surface rounded-2xl rounded-tl-sm px-4 py-3 shadow-[0_1px_3px_rgba(0,0,0,0.06)] border border-surface-container/50">
<p class="font-body-md text-[15px] leading-relaxed text-on-surface font-normal">
            SOS: Trapped near ravine, battery 14%. Audio beacon transmitting.
          </p>
<div class="mt-1.5 flex items-center justify-end">
<span class="text-[11px] font-medium text-on-surface-variant/70">14:28</span>
</div>
</div>
</div>
<!-- Outgoing Message (Operator / You) -->
<div class="flex flex-col items-end max-w-[84%] self-end">
<div class="bg-primary text-on-primary rounded-2xl rounded-tr-sm px-4 py-3 shadow-[0_1px_3px_rgba(0,0,0,0.08)]">
<p class="font-body-md text-[15px] leading-relaxed text-on-primary font-normal">
            Acknowledged Marcus! I have your GPS ping and heading towards you with medical kit.
          </p>
<div class="mt-1.5 flex items-center justify-end gap-1 text-on-primary/70">
<span class="text-[11px] font-medium">14:29</span>
<span class="material-symbols-outlined text-[15px] text-tertiary-fixed leading-none">done_all</span>
</div>
</div>
</div>
</div>
<!-- Two Big Prominent Quick-Action Tiles -->
<div class="grid grid-cols-2 gap-3 mb-2">
<!-- Location Action Tile -->
<button aria-label="Location" class="flex flex-col items-center justify-center py-5 px-4 bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.98] rounded-2xl border border-surface-container transition-all shadow-sm group" id="btn-location" type="button">
<div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center mb-2.5 text-on-surface transition-transform group-hover:scale-105">
<!-- Clean Location SVG Icon -->
<svg class="w-7 h-7 fill-current" viewbox="0 0 24 24">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"></path>
</svg>
</div>
<span class="font-headline-md text-[16px] font-bold text-on-surface">Location</span>
</button>
<!-- Listen / Speaker Action Tile -->
<button aria-label="Listen" class="flex flex-col items-center justify-center py-5 px-4 bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.98] rounded-2xl border border-surface-container transition-all shadow-sm group" id="btn-listen" type="button">
<div class="w-14 h-14 rounded-full bg-secondary-fixed text-secondary flex items-center justify-center mb-2.5 transition-transform group-hover:scale-105">
<!-- Clean Speaker SVG Icon -->
<svg class="w-7 h-7 fill-current" viewbox="0 0 24 24">
<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>
</svg>
</div>
<span class="font-headline-md text-[16px] font-bold text-on-surface">Listen</span>
</button>
</div>
</main>
<!-- Modern Rounded Rectangular Footer Input Bar -->
<footer class="fixed bottom-0 left-0 right-0 z-40 bg-surface/95 backdrop-blur-xl border-t border-surface-container-high/60 px-4 pt-3 pb-safe">
<div class="max-w-lg mx-auto flex items-center gap-2 pb-2">
<!-- Microphone Icon: Toggleable Green Active to Red Muted -->
<button aria-label="Toggle Microphone" class="w-12 h-12 flex-shrink-0 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center shadow-sm active:scale-95 transition-all duration-200" id="btn-mic" type="button">
<span class="material-symbols-outlined text-[24px]" id="mic-icon">mic</span>
</button>
<!-- Text Input Box -->
<div class="flex-1 bg-surface-container-lowest border border-surface-container-high/80 rounded-2xl px-4 h-12 flex items-center shadow-inner transition-colors focus-within:border-primary">
<input aria-label="Message" class="w-full bg-transparent border-0 outline-none text-on-surface placeholder:text-outline font-body-md text-[15px] p-0" id="message-input" placeholder="Message Marcus..." type="text"/>
</div>
<!-- Send Button on Right -->
<button aria-label="Send message" class="w-12 h-12 flex-shrink-0 rounded-2xl bg-primary hover:bg-neutral-800 active:scale-95 text-on-primary flex items-center justify-center transition-all shadow-sm" id="btn-send" type="button">
<span class="material-symbols-outlined text-[22px]">send</span>
</button>
</div>
</footer>
<script>
    (function() {
      // Toggle microphone green (active) to red (muted)
      const micBtn = document.getElementById('btn-mic');
      const micIcon = document.getElementById('mic-icon');
      let micActive = true; // Initial green active

      if (micBtn) {
        micBtn.addEventListener('click', function() {
          micActive = !micActive;
          if (micActive) {
            // Green Active
            micBtn.classList.remove('bg-secondary', 'hover:bg-red-700');
            micBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
            micIcon.textContent = 'mic';
          } else {
            // Red Muted
            micBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
            micBtn.classList.add('bg-secondary', 'hover:bg-red-700');
            micIcon.textContent = 'mic_off';
          }
        });
      }

      // Quick feedback on listen button
      const listenBtn = document.getElementById('btn-listen');
      if (listenBtn) {
        listenBtn.addEventListener('click', function() {
          listenBtn.classList.toggle('ring-2');
          listenBtn.classList.toggle('ring-secondary');
        });
      }
    })();
  </script>
</body></html>
