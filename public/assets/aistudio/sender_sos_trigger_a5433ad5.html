<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-tint": "#565e74", "surface": "#f8f9ff", "on-surface": "#0b1c30", "on-tertiary": "#ffffff", "on-error-container": "#93000a", "tertiary-fixed-dim": "#68dba9", "inverse-on-surface": "#eaf1ff", "tertiary-container": "#002114", "surface-container": "#e5eeff", "on-tertiary-container": "#069669", "surface-bright": "#f8f9ff", "background": "#f8f9ff", "primary-fixed": "#dae2fd", "on-background": "#0b1c30", "on-tertiary-fixed": "#002114", "primary-container": "#131b2e", "on-secondary-fixed": "#410002", "secondary": "#bb0112", "tertiary": "#000000", "outline-variant": "#c6c6cd", "on-error": "#ffffff", "on-secondary-fixed-variant": "#93000b", "surface-container-highest": "#d3e4fe", "error-container": "#ffdad6", "on-primary-fixed-variant": "#3f465c", "primary": "#000000", "surface-variant": "#d3e4fe", "surface-container-low": "#eff4ff", "on-tertiary-fixed-variant": "#005137", "surface-container-high": "#dce9ff", "on-surface-variant": "#45464d", "secondary-container": "#e02928", "tertiary-fixed": "#85f8c4", "on-primary-container": "#7c839b", "on-primary-fixed": "#131b2e", "on-secondary-container": "#fffbff", "on-primary": "#ffffff", "outline": "#76777d", "inverse-surface": "#213145", "on-secondary": "#ffffff", "inverse-primary": "#bec6e0", "secondary-fixed-dim": "#ffb4ab", "secondary-fixed": "#ffdad6", "surface-dim": "#cbdbf5", "error": "#ba1a1a", "primary-fixed-dim": "#bec6e0", "surface-container-lowest": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-xs": "0.25rem", "margin": "1rem", "space-lg": "1.5rem", "space-xl": "2.5rem", "space-md": "1rem", "gutter": "1rem" }, fontFamily: { "label-lg": ["JetBrains Mono"], "headline-xl-mobile": ["Space Grotesk"], "headline-lg-mobile": ["Space Grotesk"], "headline-xl": ["Space Grotesk"], "body-sm": ["Chivo"], "headline-md": ["Space Grotesk"], "body-md": ["Chivo"], "label-md": ["JetBrains Mono"], "headline-lg": ["Space Grotesk"], "body-lg": ["Chivo"], "label-sm": ["JetBrains Mono"] } } } };</script><style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        min-height: 100%;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe { padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px); }
      .pt-safe { padding-top: max(env(safe-area-inset-top, 0px), 12px); }
    }
    @keyframes pulse-wave {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.4);
        opacity: 0.25;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }
    .animate-wave-1 {
      animation: pulse-wave 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
    .animate-wave-2 {
      animation: pulse-wave 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      animation-delay: 1s;
    }
    .animate-wave-3 {
      animation: pulse-wave 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      animation-delay: 2s;
    }
  </style></head>
<body class="bg-slate-50/60 text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col justify-between selection:bg-error-container">
<!-- Header: Minimal, decluttered with Hamburger, centered "SOS Active", Settings -->
<header class="fixed top-0 w-full z-50 pt-safe bg-white/80 backdrop-blur-md border-b border-slate-100">
<div class="h-14 px-5 flex items-center justify-between">
<button aria-label="Open Navigation Menu" class="w-10 h-10 -ml-2 flex items-center justify-center rounded-full text-slate-700 hover:bg-slate-100 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">menu</span>
</button>
<div class="flex items-center gap-2">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-secondary"></span>
</span>
<h1 class="font-headline-md text-lg tracking-tight font-bold text-slate-900">SOS Active</h1>
</div>
<button aria-label="Settings" class="w-10 h-10 -mr-2 flex items-center justify-center rounded-full text-slate-700 hover:bg-slate-100 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[22px]">settings</span>
</button>
</div>
</header>
<!-- Main Body Content -->
<main class="flex-1 flex flex-col pt-20 px-6 max-w-md mx-auto w-full justify-between">
<!-- Upper Center: Radar Animation & State -->
<div class="flex flex-col items-center justify-center pt-8 pb-4 text-center">
<!-- Elegant Pulsing Radar Beacon -->
<div class="relative w-44 h-44 flex items-center justify-center mb-6">
<div class="absolute inset-4 rounded-full border border-red-500/25 bg-red-50/50 animate-wave-1"></div>
<div class="absolute inset-4 rounded-full border border-red-500/20 bg-red-100/40 animate-wave-2"></div>
<div class="absolute inset-4 rounded-full border border-red-500/15 bg-red-100/20 animate-wave-3"></div>
<!-- Center Glowing Core Node -->
<div class="relative z-10 w-24 h-24 rounded-full bg-gradient-to-tr from-secondary to-secondary-container text-white flex items-center justify-center shadow-xl shadow-red-500/25">
<span class="material-symbols-outlined text-[40px]" id="beacon-icon">sensors</span>
</div>
</div>
<!-- Clean Status Messaging -->
<h2 class="font-headline-xl-mobile text-2xl font-bold tracking-tight text-slate-900">
        Waiting for session
      </h2>
<p class="mt-2 text-slate-500 font-normal text-sm" id="transmission-status">
        Status: Waiting for a node to receive
      </p>
<!-- Subtle Simulation Toggle Pill -->
<button class="mt-4 px-3.5 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600 font-body-sm text-xs font-medium shadow-sm hover:border-slate-300 hover:bg-slate-50 active:scale-95 transition-all flex items-center gap-1.5" id="toggle-state-btn" onclick="toggleMeshStatus()">
<span class="material-symbols-outlined text-[15px] text-slate-400" id="btn-icon">cached</span>
<span id="btn-label">Simulate received</span>
</button>
</div>
<!-- Middle Section: Spacious, Minimal "Sharing" Deck -->
<div class="my-6">
<div class="flex items-center justify-between mb-3 px-1">
<h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Sharing</h3>
<span class="inline-flex items-center gap-1.5 text-xs text-slate-400 font-medium">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Live sync
        </span>
</div>
<!-- 3 Airy Clean Sharing Cards -->
<div class="grid grid-cols-3 gap-3">
<!-- 1. Location SVG Pin -->
<div class="bg-white rounded-2xl p-4 flex flex-col items-center text-center border border-slate-100 shadow-sm transition hover:shadow">
<div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center mb-2.5">
<svg class="w-6 h-6 text-secondary" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="12" cy="9" r="2.5"></circle>
</svg>
</div>
<span class="text-xs font-semibold text-slate-800">Location</span>
<span class="text-[11px] text-slate-400 mt-0.5">Accurate 3m</span>
</div>
<!-- 2. Live Audio SVG Microphone -->
<div class="bg-white rounded-2xl p-4 flex flex-col items-center text-center border border-slate-100 shadow-sm transition hover:shadow">
<div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center mb-2.5">
<svg class="w-6 h-6 text-secondary" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="12" rx="3" width="6" x="9" y="2"></rect>
<path d="M5 10v2a7 7 0 0 0 14 0v-2" stroke-linecap="round"></path>
<line stroke-linecap="round" x1="12" x2="12" y1="19" y2="22"></line>
</svg>
</div>
<span class="text-xs font-semibold text-slate-800">Live Audio</span>
<span class="text-[11px] text-slate-400 mt-0.5">Continuous</span>
</div>
<!-- 3. Dummy Profile Picture Icon -->
<div class="bg-white rounded-2xl p-4 flex flex-col items-center text-center border border-slate-100 shadow-sm transition hover:shadow">
<div class="w-12 h-12 rounded-full bg-slate-100 overflow-hidden mb-2.5 border-2 border-red-100 p-0.5">
<img alt="User Profile" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxUwXCQllfiAt6c9nPidGTiaIezcljj2_SEh_vmLHLxKkuweU8cVOBXo4iayedbFOjbO5jnNVqhbYZzlDmjeJxiQEHh47Fx14JBodqDZxSjArltE7OFs_2xrA9SifCEM_oeRdx62oWbaWSefJaQ3EmsoNBLJb9nsTe6jciNb0CS5b7WJCMCq_WzEjYynlmsWQZ-gx0l7xnbYk6V2A1ebI4f8HvoaduZAXCRbKE3Q"/>
</div>
<span class="text-xs font-semibold text-slate-800">Medical ID</span>
<span class="text-[11px] text-slate-400 mt-0.5">Attached</span>
</div>
</div>
</div>
<!-- Bottom Action Area -->
<div class="pb-safe pt-2">
<button class="w-full py-4 px-6 rounded-2xl bg-white hover:bg-red-50/50 text-secondary border border-red-200/80 font-semibold text-base shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">close</span>
        Cancel SOS
      </button>
</div>
</main>
<script>
    let isDelivered = false;
    function toggleMeshStatus() {
      const statusText = document.getElementById('transmission-status');
      const btnLabel = document.getElementById('btn-label');
      const btnIcon = document.getElementById('btn-icon');
      const beaconIcon = document.getElementById('beacon-icon');
      
      isDelivered = !isDelivered;
      if (isDelivered) {
        statusText.innerHTML = '<span class="text-emerald-600 font-medium inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>Sent successfully • Received by Node</span>';
        btnLabel.textContent = 'Reset to waiting';
        btnIcon.textContent = 'restart_alt';
        beaconIcon.textContent = 'check_circle';
      } else {
        statusText.textContent = 'Status: Waiting for a node to receive';
        btnLabel.textContent = 'Simulate received';
        btnIcon.textContent = 'cached';
        beaconIcon.textContent = 'sensors';
      }
    }
  </script>
</body></html>
