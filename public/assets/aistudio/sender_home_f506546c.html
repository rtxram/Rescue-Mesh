</head><body class="bg-surface text-on-surface font-body-md text-body-md antialiased selection:bg-surface-container-highest flex flex-col justify-between min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/90 backdrop-blur-md"><div class="h-16 px-6 flex items-center justify-between"><button aria-label="Menu" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container/60 active:scale-95 transition-all"><span class="material-symbols-outlined text-[24px]">menu</span></button><h1 class="font-headline-md text-[19px] font-semibold tracking-tight text-on-surface">Rescue Mesh</h1><button aria-label="Settings" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container/60 active:scale-95 transition-all"><span class="material-symbols-outlined text-[22px]">settings</span></button></div></header><main class="flex-1 flex flex-col items-center justify-center w-full pt-20 pb-24 px-6"><div class="flex flex-col items-center justify-center w-full max-w-sm select-none my-auto">

<!-- High-Contrast Modern SOS Button -->

<circle cx="96" cy="96" fill="none" r="90" stroke="rgba(255,255,255,0.18)" stroke-width="5"></circle>
<circle class="transition-all duration-75" cx="96" cy="96" fill="none" id="sosProgressBar" r="90" stroke="#FFFFFF" stroke-dasharray="565.48" stroke-dashoffset="565.48" stroke-linecap="round" stroke-width="5"></circle>
</svg>

</div>

      </button>

<script>
  (function initTactileSos() {
    const sosTrigger = document.getElementById('sosTrigger');
    const progressBar = document.getElementById('sosProgressBar');
    const notice = document.getElementById('sosHoldNotice');
    const alertModal = document.getElementById('sosAlertModal');
    const cancelSosBtn = document.getElementById('cancelSosBtn');

    if (!sosTrigger || !progressBar) return;

    const circumference = 2 * Math.PI * 90; // ~565.48
    let holdTimer = null;
    let startTime = 0;
    const requiredHoldDuration = 2000; // 2 seconds

    function startHold(e) {
      if (e.cancelable) e.preventDefault();
      startTime = Date.now();
      
      notice.textContent = "Transmitting distress in 2s...";
      notice.classList.add('text-secondary', 'font-semibold');

      if (navigator.vibrate) {
        navigator.vibrate(50);
      }

      function frame() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / requiredHoldDuration, 1);
        const offset = circumference - (progress * circumference);
        progressBar.style.strokeDashoffset = offset;

        if (progress < 1) {
          holdTimer = requestAnimationFrame(frame);
        } else {
          triggerSosBroadcast();
        }
      }

      holdTimer = requestAnimationFrame(frame);
    }

    function cancelHold() {
      if (holdTimer) {
        cancelAnimationFrame(holdTimer);
        holdTimer = null;
      }
      progressBar.style.strokeDashoffset = circumference;
      notice.textContent = "Hold for 2 seconds to activate";
      notice.classList.remove('text-secondary', 'font-semibold');
    }

    function triggerSosBroadcast() {
      cancelHold();
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100, 50, 300]);
      }
      alertModal.classList.remove('hidden');
    }

    sosTrigger.addEventListener('touchstart', startHold, { passive: false });
    sosTrigger.addEventListener('touchend', cancelHold);
    sosTrigger.addEventListener('touchcancel', cancelHold);

    sosTrigger.addEventListener('mousedown', startHold);
    window.addEventListener('mouseup', cancelHold);

    cancelSosBtn.addEventListener('click', () => {
      alertModal.classList.add('hidden');
    });
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-md border-t border-surface-container-high/60"><div class="h-16 px-8 flex items-center justify-around max-w-md mx-auto"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] text-primary transition-colors" data-path="home" href="#"><span class="material-symbols-outlined text-[24px]">radio_button_checked</span><span class="font-headline-md text-[11px] font-semibold tracking-wider uppercase mt-1">Home</span></a><a class="flex flex-col items-center justify-center min-w-[56px] text-on-surface-variant/70 hover:text-on-surface transition-colors" data-path="nodes-nearby" href="#"><span class="material-symbols-outlined text-[24px]">hub</span><span class="font-headline-md text-[11px] font-medium tracking-wider uppercase mt-1">Nodes</span></a><a class="flex flex-col items-center justify-center min-w-[56px] text-on-surface-variant/70 hover:text-on-surface transition-colors" data-path="configuration" href="#"><span class="material-symbols-outlined text-[24px]">tune</span><span class="font-headline-md text-[11px] font-medium tracking-wider uppercase mt-1">Config</span></a></div></nav></body></html>
